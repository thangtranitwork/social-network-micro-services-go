name: Go Microservices CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  # ========================================================
  # Backend Go Services CI (Lint, Test, Build)
  # ========================================================
  go-ci:
    name: Build & Test Go Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Vet Check
        run: go vet $(go list ./... | grep -v /scripts)

      - name: Run Unit Tests
        run: go test -v -short $(go list ./... | grep -v /scripts)

      - name: Verify Build of All Go Microservices
        run: |
          mkdir -p bin
          services=("api-gateway" "auth-service" "user-service" "post-service" "chat-service" "notification-service" "file-service" "admin-service" "search-service" "story-service" "fcm-service")
          for svc in "${services[@]}"; do
            echo "🔨 Building $svc..."
            go build -o "bin/$svc" "./$svc"
          done
          echo "✅ All Go microservices built successfully!"
