name: Go Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: CI (Lint, Test, Verify Build)
  # ========================================================
  ci:
    name: Build & Test Go Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Vet Check
        run: go vet $(go list ./... | grep -v /scripts)

      - name: Run Unit Tests
        run: go test -v -short $(go list ./... | grep -v /scripts)

      - name: Verify Build of All Go Microservices
        run: |
          mkdir -p bin
          services=("api-gateway" "auth-service" "user-service" "post-service" "chat-service" "notification-service" "file-service" "admin-service" "search-service" "story-service" "fcm-service" "recommendation-service")
          for svc in "${services[@]}"; do
            echo "🔨 Building $svc..."
            go build -o "bin/$svc" "./$svc"
          done
          echo "✅ All Go microservices built successfully!"

  # ========================================================
  # JOB 2: CD (Deploy to VPS - Runs ONLY after CI succeeds)
  # ========================================================
  cd:
    name: Smart Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Detect Changed Services
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          echo "=== CHANGED FILES ==="
          echo "$CHANGED_FILES"
          echo "====================="

          if echo "$CHANGED_FILES" | grep -qE "^(internal/|go\.mod|go\.sum|pb/|logger/|exception/|scripts/|deploy-vps\.sh)"; then
            echo "Shared backend code or core config changed. Deploying ALL microservices."
            echo "DEPLOY_SERVICES=all" >> $GITHUB_ENV
          else
            SERVICES_TO_DEPLOY=""
            valid_services=("api-gateway" "auth-service" "user-service" "post-service" "chat-service" "notification-service" "ai-service" "file-service" "admin-service" "search-service" "story-service" "fcm-service" "recommendation-service")
            for svc in "${valid_services[@]}"; do
              if echo "$CHANGED_FILES" | grep -qE "^${svc}/"; then
                SERVICES_TO_DEPLOY="$SERVICES_TO_DEPLOY $svc"
              fi
            done

            if [ -z "$SERVICES_TO_DEPLOY" ]; then
              echo "No backend services changed."
              echo "DEPLOY_SERVICES=none" >> $GITHUB_ENV
            else
              echo "Deploying specific services:$SERVICES_TO_DEPLOY"
              echo "DEPLOY_SERVICES=$SERVICES_TO_DEPLOY" >> $GITHUB_ENV
            fi
          fi

          if echo "$CHANGED_FILES" | grep -qE "^(social-network-ui/|deploy-ui-vps\.sh)"; then
            echo "UI code changed."
            echo "DEPLOY_UI=true" >> $GITHUB_ENV
          else
            echo "UI code did not change."
            echo "DEPLOY_UI=false" >> $GITHUB_ENV
          fi

      - name: Deploy Go Microservices
        if: env.DEPLOY_SERVICES != 'none'
        env:
          SERVER_IP: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          chmod +x deploy-vps.sh scripts/deploy.sh.template
          for svc in ${{ env.DEPLOY_SERVICES }}; do
            echo "🚀 Deploying targeted service: $svc"
            ./deploy-vps.sh "$svc" "Automated CD deployment (Commit: ${{ github.sha }})"
          done

      - name: Deploy Next.js UI Container
        if: env.DEPLOY_UI == 'true' && hashFiles('social-network-ui/**') != ''
        env:
          SERVER_IP: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          chmod +x deploy-ui-vps.sh
          ./deploy-ui-vps.sh
