name: social_network_mobile
description: "Mobile Application for Social Network Microservices System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # State Management & DI
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Realtime Communication
  web_socket_channel: ^3.0.0
  flutter_webrtc: ^1.6.2+hotfix.4

  # Firebase & Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.1+2

  # Storage & Offline
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Media & Files
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

dependency_overrides:
  package_info_plus: ^10.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
