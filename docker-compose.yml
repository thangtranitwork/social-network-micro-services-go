version: '3.8'
name: social-network-go-infra

services:
  # 1. PostgreSQL (Auth Service Account Database)
  postgres:
    image: postgres:15-alpine
    container_name: sn-postgres-auth
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"

  # 2. Neo4j (Social & Content Graph Database)
  neo4j:
    image: neo4j:5-community
    container_name: sn-neo4j-graph
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474" # Browser interface
      - "${NEO4J_BOLT_PORT:-17687}:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: "no"

  # 3. Redis (Cache, OTP & Token Blacklist)
  redis:
    image: redis:7.2-alpine
    container_name: sn-redis-cache
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    restart: "no"

  # 4. MongoDB (Chat History Database)
  mongodb:
    image: mongo:6-jammy
    container_name: sn-mongodb-chat
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: "no"

  # 5. Kafka Event Broker (with Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sn-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sn-kafka-broker
    ports:
      - "${KAFKA_HOST_PORT:-19092}:9092"
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:${KAFKA_HOST_PORT:-19092}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    restart: "no"

  # 6. MinIO (Object Storage for Images and Videos)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: sn-minio-storage
    ports:
      - "${MINIO_API_PORT:-19000}:9000" # API
      - "${MINIO_CONSOLE_PORT:-19001}:9001" # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: "no"

  # 7. Elasticsearch & Kibana (Full-Text Search Engine & Web Console)
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: sn-elasticsearch
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: "no"

  kibana:
    image: kibana:8.13.4
    container_name: sn-kibana
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: "no"

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  mongodb_data:
  minio_data:
  elasticsearch_data:

